server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # vue-router 的 history 模式：刷新子路由不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ^~ 前缀：让 /api/ 与 /uploads/ 优先于下面的正则 location，
    # 否则 /uploads/xxx.png 会被 `\.png$` 那条抢走，nginx 去本地目录找文件 → 404
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        # 必须用 $http_host 而不是 $host：$host 不含端口，
        # 后端 request.base_url 会算出 http://127.0.0.1/，上传接口返回的图片地址就丢了 8080
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 对话是 SSE：必须关掉缓冲，否则回答会攒到最后一次性吐出来
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 用户上传的图片由后端托管
    location ^~ /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    # 前端是单页应用，静态资源可以长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
